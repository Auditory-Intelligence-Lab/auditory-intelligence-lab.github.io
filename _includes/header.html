<header class="ailab-header">
  <div class="container-fluid ailab-header-inner">

    <!-- Brand -->
    <a class="ailab-brand" href="{{ site.baseurl }}/">
      <img src="{{ site.baseurl }}/images/logo_ailabs.png"
           alt="AILab Logo">

      <div class="ailab-brand-text">
        <span class="brand-name">Auditory Intelligence Lab</span>
        <span class="brand-university">Sogang University</span>
      </div>
    </a>

    <!-- Mobile Menu Button -->
    <button type="button"
            class="ailab-menu-toggle"
            aria-label="Toggle navigation"
            aria-controls="ailab-navigation"
            aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Navigation -->
    <nav class="ailab-navigation"
         id="ailab-navigation"
         aria-label="Main navigation">

      <a href="{{ site.baseurl }}/"
         {% if page.url == '/' %}class="active" aria-current="page"{% endif %}>
        Home
      </a>

      {% assign team_prefix = page.url | slice: 0, 6 %}

      <details class="ailab-dropdown {% if team_prefix == '/team/' %}active{% endif %}">
        <summary>Team <span class="nav-chevron"></span></summary>

        <div class="ailab-dropdown-menu">

          <a href="{{ site.baseurl }}/team/"
             {% if page.url == '/team/' %}class="active" aria-current="page"{% endif %}>
            Professor
          </a>

          <a href="{{ site.baseurl }}/team/members/"
             {% if page.url == '/team/members/' %}class="active" aria-current="page"{% endif %}>
            Current Members
          </a>

          <a href="{{ site.baseurl }}/team/alumni/"
             {% if page.url == '/team/alumni/' %}class="active" aria-current="page"{% endif %}>
            Alumni
          </a>

        </div>
      </details>

      <a href="{{ site.baseurl }}/publications/"
         {% if page.url == '/publications/' %}class="active" aria-current="page"{% endif %}>
        Publications
      </a>

      <a href="{{ site.baseurl }}/research/"
         {% if page.url == '/research/' %}class="active" aria-current="page"{% endif %}>
        Research
      </a>

      <a href="{{ site.baseurl }}/projects/"
         {% if page.url == '/projects/' %}class="active" aria-current="page"{% endif %}>
        Projects
      </a>

      <a href="{{ site.baseurl }}/awards/"
         {% if page.url == '/awards/' %}class="active" aria-current="page"{% endif %}>
        Awards
      </a>

      <a href="{{ site.baseurl }}/resources/"
         {% if page.url == '/resources/' %}class="active" aria-current="page"{% endif %}>
        Research Resources
      </a>

    </nav>
  </div>
</header>

<script>
(function () {
    const toggle = document.querySelector('.ailab-menu-toggle');
    const navigation = document.querySelector('.ailab-navigation');
    const dropdown = document.querySelector('.ailab-dropdown');

    function closeMenu() {
        navigation.classList.remove('is-open');
        toggle.setAttribute('aria-expanded', 'false');
        dropdown.open = false;
    }

    toggle.addEventListener('click', function () {
        const isOpen = navigation.classList.toggle('is-open');
        toggle.setAttribute('aria-expanded', String(isOpen));

        if (!isOpen) {
            dropdown.open = false;
        }
    });

    document.addEventListener('click', function (event) {
        if (!dropdown.contains(event.target)) {
            dropdown.open = false;
        }

        if (!event.target.closest('.ailab-header')) {
            closeMenu();
        }
    });

    document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
            if (dropdown.open) {
                dropdown.open = false;
                dropdown.querySelector('summary').focus();
            } else if (navigation.classList.contains('is-open')) {
                closeMenu();
                toggle.focus();
            }
        }
    });
})();
</script>
